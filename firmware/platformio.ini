; LED de mesa para AtiendeTe. Placa: ESP32 DevKit V1 (30 pines).
; El cableado, la red y el flasheo están en el README de la raíz del repo.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
extra_scripts = pre:elegir_config.py
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2
